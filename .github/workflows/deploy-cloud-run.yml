name: Manual Cloud Run deployment
on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Confirm deployment to the configured public Cloud Run service
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  deploy:
    if: ${{ inputs.confirm_deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
      IMAGE_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
      SERVICE_NAME: ticket-maestro
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and push production image
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$GCP_PROJECT_ID" || -z "$IMAGE_REPOSITORY" || -z "$FIREBASE_WEB_API_KEY" || -z "$FIREBASE_AUTH_DOMAIN" ]]; then
            echo "Configure GCP_PROJECT_ID, ARTIFACT_REGISTRY_REPOSITORY, FIREBASE_AUTH_DOMAIN and FIREBASE_WEB_API_KEY first." >&2
            exit 1
          fi
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${IMAGE_REPOSITORY}/${SERVICE_NAME}:${GITHUB_SHA}"
          docker buildx build --platform linux/amd64 --push --tag "$image" \
            --build-arg VITE_FIREBASE_API_KEY="$FIREBASE_WEB_API_KEY" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="$FIREBASE_AUTH_DOMAIN" \
            --build-arg VITE_FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --build-arg VITE_FIREBASE_AUTH_EMULATOR_URL= .
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - name: Deploy to Cloud Run
        env:
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [[ -z "$RUNTIME_SERVICE_ACCOUNT" ]]; then
            echo "Configure CLOUD_RUN_SERVICE_ACCOUNT before deploying." >&2
            exit 1
          fi
          gcloud run deploy "$SERVICE_NAME" --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --cpu 1 --memory 512Mi --min 0 --max 1 --concurrency 10 --port 8080 \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --set-env-vars "NODE_ENV=production,FIREBASE_PROJECT_ID=${GCP_PROJECT_ID},EMAIL_MODE=simulation" \
            --allow-unauthenticated
